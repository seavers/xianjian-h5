<!doctype html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
	<meta name="apple-mobile-web-app-capable" content="yes" />
	<meta name="apple-mobile-web-app-status-bar-style" content="black" />
	<link rel="apple-touch-startup-image" href="pal.ico" />
	<link rel="apple-touch-icon" href="pal.ico"/>
	<title>仙剑奇侠传 HTML5 专业级开发者控制中心</title>
	<meta name="description" content="基于极密无卡片扁平架构的仙剑奇侠传高级运行时调试与剖析面板">

	<!-- 引入极客高解析度 Google 字体 -->
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=JetBrains+Mono:wght@300;400;500;700&display=swap" rel="stylesheet">
	<link rel="stylesheet" href="dashboard/gameData/styles/gameData.css">

	<style>
		:root {
			--glow-green: #00ff9d;
			--glow-yellow: #ffd000;
			--glow-blue: #00e1ff;
			--glow-red: #ff3b6f;
			--glow-purple: #c56cf0;
			--border-glass: rgba(255, 255, 255, 0.05);
			--bg-dark: #050508;
			--panel-inner-bg: rgba(13, 13, 20, 0.96);
			--grid-item-bg: rgba(255, 255, 255, 0.015);
			--image-explorer-scale: 2;
		}

		* {
			box-sizing: border-box;
			margin: 0;
			padding: 0;
		}

		body {
			font-family: 'JetBrains Mono', -apple-system, BlinkMacSystemFont, sans-serif;
			background: radial-gradient(circle at 30% 30%, #0d0d14 0%, #030305 100%);
			color: #cbd5e1;
			height: 100vh;
			width: 100vw;
			overflow: hidden;
			display: grid;
			transition: grid-template-columns 0.05s linear;
		}

		body.game-viewport-2x {
			grid-template-columns: 1fr minmax(0px, calc(100vw - 670px)); /* 默认右侧面板为 800px 超宽极密面板 */
		}
		body.game-viewport-3x {
			grid-template-columns: 1fr minmax(0px, calc(100vw - 970px)); /* 默认右侧面板为 800px 超宽极密面板 */
		}
		body.game-viewport-4x {
			grid-template-columns: 1fr minmax(0px, calc(100vw - 1300px)); /* 默认右侧面板为 800px 超宽极密面板 */
		}

		/* ==================== 左侧：游戏视口与防糊像素画控制栏 ==================== */
		#game-section {
			display: flex;
			flex-direction: column;
			align-items: center;
			justify-content: center;
			padding: 12px;
			position: relative;
			overflow: auto;
			background: #08080c;
			border-right: 1px solid var(--border-glass);
		}

		#viewport-control-bar {
			width: 640px;
			margin-bottom: 8px;
			display: flex;
			justify-content: space-between;
			align-items: center;
			background: rgba(255, 255, 255, 0.02);
			border: 1px solid rgba(255, 255, 255, 0.04);
			padding: 6px 12px;
			border-radius: 4px;
			transition: width 0.3s cubic-bezier(0.16, 1, 0.3, 1);
		}

		.viewport-title {
			font-size: 11px;
			font-weight: 800;
			letter-spacing: 0.5px;
			color: #ffd000;
			text-shadow: 0 0 8px rgba(255, 208, 0, 0.15);
		}

		.scale-buttons {
			display: flex;
			gap: 4px;
		}

		.btn-scale {
			background: rgba(255, 255, 255, 0.03);
			border: 1px solid rgba(255, 255, 255, 0.06);
			color: rgba(255, 255, 255, 0.5);
			padding: 3px 8px;
			border-radius: 3px;
			font-size: 9.5px;
			font-weight: 600;
			cursor: pointer;
			transition: all 0.15s;
		}

		.btn-scale:hover {
			background: rgba(255, 255, 255, 0.08);
			color: #fff;
		}

		.btn-scale.active {
			background: rgba(0, 255, 157, 0.1) !important;
			border-color: var(--glow-green) !important;
			color: var(--glow-green) !important;
			box-shadow: 0 0 8px rgba(0, 255, 157, 0.15);
		}

		#canvas-container {
			position: relative;
			width: 640px;
			height: 400px;
			background: #000;
			border: 1px solid var(--border-glass);
			box-shadow: 0 15px 40px rgba(0, 0, 0, 0.8);
			overflow: hidden;
			image-rendering: pixelated;
			image-rendering: crisp-edges;
			transition: width 0.3s cubic-bezier(0.16, 1, 0.3, 1), height 0.3s cubic-bezier(0.16, 1, 0.3, 1);
		}

		#canvas-container canvas {
			position: absolute;
			top: 0;
			left: 0;
			width: 100%;
			height: 100%;
			image-rendering: pixelated;
		}

		#info {
			position: absolute;
			z-index: 100;
			background: rgba(5, 5, 8, 0.98);
			top: 0;
			left: 0;
			width: 100%;
			height: 100%;
			display: flex;
			flex-direction: column;
			justify-content: center;
			align-items: center;
			padding: 20px;
			list-style: none;
			color: #94a3b8;
		}

		#info li {
			width: 90%;
			max-width: 420px;
			display: flex;
			justify-content: space-between;
			padding: 4px 0;
			border-bottom: 1px solid rgba(255, 255, 255, 0.03);
			font-size: 10.5px;
		}

		.res-name { color: #f8fafc; font-weight: bold; }
		.res-pct { color: var(--glow-yellow); font-weight: bold; }
		.done-badge { background: rgba(0, 255, 157, 0.15); color: var(--glow-green); padding: 1px 4px; border-radius: 2px; font-size: 9px; }

		#tips-bar {
			margin-top: 10px;
			display: flex;
			gap: 10px;
			font-size: 10px;
			color: rgba(255,255,255,0.2);
			background: rgba(255, 255, 255, 0.01);
			padding: 4px 10px;
			border-radius: 2px;
			border: 1px solid rgba(255,255,255,0.02);
		}

		#tips-bar span kbd {
			background: rgba(255,255,255,0.04);
			color: #ffd000;
			padding: 1px 3px;
			border-radius: 2px;
			margin-right: 2px;
		}

		/* ==================== 右侧：超高密度扁平专业调试面板 (1000px) ==================== */
		#dashboard {
			background: var(--bg-dark);
			border-left: 1px solid var(--border-glass);
			display: flex;
			flex-direction: column;
			overflow: hidden;
			position: relative;
		}

		#resize-handle {
			position: absolute;
			top: 0;
			left: -3px;
			width: 6px;
			height: 100%;
			cursor: col-resize;
			z-index: 9999;
			background: transparent;
		}
		#resize-handle:hover {
			background: rgba(0, 255, 157, 0.15);
		}

		#dashboard-header {
			padding: 8px 12px;
			border-bottom: 1px solid var(--border-glass);
			display: flex;
			align-items: center;
			justify-content: space-between;
			background: rgba(0, 0, 0, 0.4);
		}

		.db-title h2 {
			font-size: 11.5px;
			font-weight: 700;
			letter-spacing: 0.5px;
			color: var(--glow-green);
			text-shadow: 0 0 6px rgba(0, 255, 157, 0.15);
		}

		.dashboard-header-main {
			display: flex;
			align-items: center;
			gap: 6px;
		}

		.dashboard-status-dot {
			width: 5px;
			height: 5px;
			background: var(--glow-green);
			border-radius: 50%;
			box-shadow: 0 0 6px var(--glow-green);
		}

		.dashboard-header-actions {
			display: flex;
			align-items: center;
			gap: 8px;
		}

		.launch-btn {
			padding: 2px 6px;
			font-size: 8.5px;
			font-weight: bold;
			cursor: pointer;
			transition: all 0.1s;
		}

		.launch-btn:disabled {
			cursor: not-allowed;
			opacity: 0.45;
		}

		.launch-btn--battle {
			color: #a78bfa;
			border-color: rgba(167, 139, 250, 0.2);
			margin-right: 2px;
		}

		.launch-btn--battle-image {
			color: #00fffa;
			border-color: rgba(0, 255, 250, 0.2);
			margin-right: 2px;
		}

		.launch-btn--game-data {
			color: var(--glow-yellow);
			border-color: rgba(255, 215, 0, 0.2);
		}

		.launch-btn--image-explorer {
			color: var(--glow-green);
			border-color: rgba(0, 255, 157, 0.2);
		}

		.tool-modal-header {
			background: rgba(0, 0, 0, 0.6);
			padding: 8px 12px;
			border-bottom: 1px solid var(--border-glass);
			display: flex;
			justify-content: space-between;
			align-items: center;
		}

		.tool-modal-title-row {
			display: flex;
			align-items: center;
			gap: 6px;
		}

		.tool-modal-dot {
			width: 5px;
			height: 5px;
			background: var(--modal-accent, var(--glow-green));
			border-radius: 50%;
			box-shadow: 0 0 6px var(--modal-accent, var(--glow-green));
		}

		.tool-modal-heading {
			font-size: 11px;
			font-weight: bold;
			color: var(--modal-accent, var(--glow-green));
			letter-spacing: 0.5px;
		}

		.tool-modal-close {
			background: transparent;
			border: none;
			color: rgba(255, 255, 255, 0.4);
			font-size: 14px;
			cursor: pointer;
			transition: color 0.15s;
			outline: none;
		}

		.tool-modal-close:hover {
			color: var(--modal-accent, #ff3b6f);
		}

		.tool-modal-tabbar {
			background: rgba(0, 0, 0, 0.4);
			padding: 6px 12px;
			border-bottom: 1px solid var(--border-glass);
			display: flex;
			gap: 4px;
			align-items: center;
			flex-wrap: wrap;
		}

		.tool-modal-tab-btn {
			color: rgba(255, 255, 255, 0.6);
			border-color: rgba(255, 255, 255, 0.06);
			padding: 2px 10px;
			font-size: 8.5px;
			cursor: pointer;
		}

		.tool-modal-tab-btn--compact {
			padding: 2px 8px;
		}

		.tool-modal-tab-btn.is-active,
		.tool-modal-tab-btn.active {
			color: var(--tab-accent, var(--modal-accent, var(--glow-green)));
			border-color: var(--tab-accent, var(--modal-accent, var(--glow-green)));
		}

		#panel-container {
			flex: 1;
			display: flex;
			flex-direction: column;
			background: var(--panel-inner-bg);
		}

		#panel-container::-webkit-scrollbar {
			width: 3px;
		}
		#panel-container::-webkit-scrollbar-thumb {
			background: rgba(255,255,255,0.05);
		}

		/* 绝对无 Padding 卡片！直接使用高密边界线 */
		.panel-row {
			display: grid;
			grid-template-columns: 480px 1fr; /* 左右两大精细列平铺，充分吞吐 1000px 宽度 */
			border-bottom: 1px solid var(--border-glass);
		}

		.panel-col {
			padding: 6px 8px;
			display: flex;
			flex-direction: column;
			gap: 4px;
		}
		.panel-col.right-border {
			border-right: 1px solid var(--border-glass);
		}

		.section-header {
			font-size: 10px;
			font-weight: 800;
			color: rgba(255, 255, 255, 0.35);
			text-transform: uppercase;
			letter-spacing: 0.5px;
			border-bottom: 1px solid rgba(255,255,255,0.03);
			padding-bottom: 2px;
			margin-bottom: 2px;
			display: flex;
			align-items: center;
			gap: 4px;
		}

		/* 📊 场景与事件高级统计 */
		.scene-dense-grid {
			display: grid;
			grid-template-columns: repeat(4, 1fr);
			gap: 3px;
		}

		.scene-item {
			background: var(--grid-item-bg);
			border: 1px solid rgba(255, 255, 255, 0.02);
			padding: 3px 5px;
			display: flex;
			flex-direction: column;
		}

		.scene-label {
			font-size: 8px;
			color: rgba(255, 255, 255, 0.25);
			margin-bottom: 1px;
			text-transform: uppercase;
		}

		.scene-val {
			font-size: 10.5px;
			font-weight: 600;
			color: var(--glow-blue);
		}

		/* 统计模式徽章分布栏 */
		.stat-modes-container {
			display: flex;
			flex-wrap: wrap;
			gap: 2.5px;
			background: rgba(0,0,0,0.2);
			padding: 3px 5px;
			border-radius: 2px;
			border: 1px solid rgba(255,255,255,0.02);
		}

		.stat-mode-badge {
			font-size: 8px;
			padding: 1px 3px;
			border-radius: 1.5px;
			background: rgba(255,255,255,0.03);
			border: 1px solid rgba(255,255,255,0.04);
			color: rgba(255,255,255,0.6);
		}
		.stat-mode-badge span {
			font-weight: bold;
			color: var(--glow-yellow);
			margin-left: 2px;
		}

		/* 👥 主角 24 项多维核心大矩阵 */
		.hero-block-container {
			display: grid;
			grid-template-columns: 80px 1fr;
			gap: 6px;
		}

		.hero-avatar-card {
			background: rgba(0,0,0,0.3);
			border: 1px solid rgba(255,255,255,0.03);
			border-radius: 2px;
			display: flex;
			flex-direction: column;
			justify-content: center;
			align-items: center;
			padding: 4px;
		}

		.hero-name {
			font-size: 11px;
			font-weight: bold;
			color: #fff;
		}
		.hero-image-lbl {
			font-size: 7.5px;
			color: rgba(255,255,255,0.25);
			margin-top: 1px;
		}

		.hero-attributes-matrix {
			display: grid;
			grid-template-columns: repeat(4, 1fr); /* 4x6 极密高容积平铺 */
			gap: 2px;
		}

		.hero-attr-chip {
			background: var(--grid-item-bg);
			border: 1px solid rgba(255,255,255,0.02);
			padding: 2px 4px;
			display: flex;
			justify-content: space-between;
			align-items: center;
		}

		.hero-attr-lbl {
			font-size: 8px;
			color: rgba(255,255,255,0.3);
		}

		.hero-attr-val {
			font-size: 9.5px;
			font-weight: 600;
			color: var(--glow-green);
		}

		/* 🎒 行囊网格 ＆ 物品 20 项底层高级解码器 */
		.bag-cols-container {
			display: grid;
			grid-template-columns: 180px 1fr;
			gap: 6px;
		}

		.bag-grid {
			display: grid;
			grid-template-columns: repeat(4, 1fr);
			gap: 2.5px;
			max-height: 140px;
			overflow-y: auto;
		}

		.bag-slot {
			background: rgba(0,0,0,0.2);
			border: 1px solid rgba(255, 255, 255, 0.03);
			height: 25px;
			display: flex;
			justify-content: center;
			align-items: center;
			font-size: 9px;
			font-weight: 500;
			color: rgba(255,255,255,0.5);
			cursor: pointer;
			transition: all 0.1s;
		}
		.bag-slot:hover {
			border-color: var(--glow-green);
			background: rgba(0, 255, 157, 0.04);
			color: var(--glow-green);
		}
		.bag-slot.active {
			border-color: var(--glow-yellow) !important;
			background: rgba(255, 208, 0, 0.06) !important;
			color: var(--glow-yellow) !important;
		}

		.bag-inspector {
			background: rgba(0,0,0,0.35);
			border: 1px solid rgba(255,255,255,0.03);
			padding: 4px 6px;
			display: flex;
			flex-direction: column;
		}

		.ins-header {
			font-size: 9px;
			font-weight: bold;
			color: #ffd000;
			border-bottom: 1px solid rgba(255,255,255,0.04);
			padding-bottom: 2px;
			margin-bottom: 3px;
		}

		.ins-table {
			display: grid;
			grid-template-columns: repeat(3, 1fr); /* 3列极密表格排布 20 项数据 */
			gap: 2px;
		}

		.ins-field {
			background: rgba(255,255,255,0.01);
			padding: 1px 3px;
			display: flex;
			justify-content: space-between;
			font-size: 8px;
			border-bottom: 1px dotted rgba(255,255,255,0.02);
		}
		.ins-f-label { color: rgba(255,255,255,0.25); }
		.ins-f-val { color: #fff; font-weight: 500; }

		/* 👾 附近 NPC 袖珍实体 NxM 芯片网格 */
		.npc-fleet-grid {
			display: grid;
			grid-template-columns: repeat(6, 1fr); /* 一行平铺 6 栏，空间效率爆发性提升！ */
			gap: 2.5px;
			max-height: 80px;
			overflow-y: auto;
			padding-right: 2px;
		}

		.npc-micro-card {
			background: rgba(0,0,0,0.2);
			border: 1px solid rgba(255,255,255,0.02);
			padding: 3px 4px;
			cursor: pointer;
			transition: all 0.1s;
			display: flex;
			flex-direction: column;
			justify-content: center;
			height: 32px;
		}
		.npc-micro-card:hover {
			border-color: var(--glow-green);
			background: rgba(0, 255, 157, 0.03);
		}
		.npc-micro-card.highlighted {
			border-color: var(--glow-green) !important;
			background: rgba(0, 255, 157, 0.08) !important;
			box-shadow: 0 0 6px rgba(0, 255, 128, 0.2);
		}

		.npc-mc-head {
			display: flex;
			justify-content: space-between;
			font-size: 8.5px;
			font-weight: bold;
			color: #fff;
		}
		.npc-mc-pos {
			font-size: 7.5px;
			color: rgba(255,255,255,0.2);
		}

		/* 💻 并行指令控制台 ＆ 系统极客分析指标 */
		.terminal-section {
			border-bottom: 1px solid var(--border-glass);
			display: flex;
			flex-direction: column;
			background: rgba(5, 5, 8, 0.98);
			flex-shrink: 0; /* 强制锁定，绝不压缩 */
		}

		/* 系统分析极客标签面板 */
		.profiler-header {
			background: rgba(0, 0, 0, 0.5);
			border-bottom: 1px solid var(--border-glass);
			padding: 4px 8px;
			display: flex;
			flex-wrap: wrap;
			gap: 4px;
		}

		.prof-badge {
			font-size: 8px;
			font-weight: bold;
			padding: 1px 4px;
			border-radius: 1px;
			background: rgba(255,255,255,0.02);
			border: 1px solid rgba(255,255,255,0.04);
			color: rgba(255,255,255,0.45);
		}
		.prof-badge span {
			color: var(--glow-green);
			margin-left: 2px;
		}

		.log-stream {
			height: 1000px; /* 固定限制外层高度至 1000px */
			background: #030305;
			overflow-y: scroll;
			position: relative;
		}

		.log-stream-inner {
			display: flex;
			flex-direction: column;
			gap: 3px;
			padding: 6px 8px;
			min-height: 100%;
			font-family: 'JetBrains Mono', monospace;
			font-size: 8.5px;
		}

		.log-item {
			border-left: 1.5px solid var(--glow-green);
			padding-left: 5px;
			color: rgba(255, 255, 255, 0.8);
		}
		.log-item.scene { border-color: var(--glow-blue); }
		.log-item.trig { border-color: var(--glow-yellow); }
		.log-item.auto { border-color: var(--glow-green); }
		.log-item.item { border-color: var(--glow-red); }

		.log-time { color: rgba(255,255,255,0.2); font-size: 7.5px; margin-right: 3px; }
		.log-script-id { color: rgba(255,255,255,0.15); font-size: 7.5px; margin-right: 3px; }
		.log-badge {
			padding: 0px 2px;
			border-radius: 1px;
			font-size: 7.5px;
			font-weight: bold;
			margin-right: 3px;
		}
		.log-badge.scene { background: rgba(0, 225, 255, 0.1); color: var(--glow-blue); }
		.log-badge.trig { background: rgba(255, 208, 0, 0.1); color: var(--glow-yellow); }
		.log-badge.auto { background: rgba(0, 255, 157, 0.1); color: var(--glow-green); }
		.log-badge.item { background: rgba(255, 59, 111, 0.1); color: var(--glow-red); }

		.log-code { color: #ec4899; font-weight: bold; }
		.log-desc { color: #93c5fd; }

		function initSoundToggle() {
			const enabled = localStorage.getItem('sound_enabled') !== 'false';

			if (btn) {
				if (enabled) {
					btn.innerText = "🔊 声音: 开启";
					btn.style.color = "var(--glow-yellow)";
				} else {
					btn.innerText = "🔇 声音: 关闭";
					btn.style.color = "rgba(255, 255, 255, 0.4)";
				}
			}
		}

		async function toggleSound() {
			const enabled = localStorage.getItem('sound_enabled') !== 'false';
			const nextStatus = !enabled;
			localStorage.setItem('sound_enabled', nextStatus ? 'true' : 'false');
			initSoundToggle();
			
			if (window.musicModule && typeof window.musicModule.updateVolume === 'function') {
				window.musicModule.updateVolume();
			}
		}

		document.addEventListener('DOMContentLoaded', () => {

		function markAsyncActionReady(buttonId) {
			const button = document.getElementById(buttonId);
			if (!button) {
				return;
			}

			button.disabled = false;
			button.style.opacity = '1';
			button.style.cursor = 'pointer';
		}

		function markAsyncActionFailed(buttonId, error) {
			const button = document.getElementById(buttonId);
			if (!button) {
				return;
			}

			button.disabled = true;
			button.style.opacity = '0.45';
			button.style.cursor = 'not-allowed';
			console.error(`异步模块加载失败: ${buttonId}`, error);
		}

		function getDetailedItemInfo(itemId) {
			// 初始化仙剑1常见物品高级解耦数据库
			const DB = {

					sell: '50 文',

					mag: '无',
					lck: '无',

					equscr: '无',

					flags: '0x0021',
					consumable: '是',

					buy: '9999 文',
					sell: '5000 文',
					type: '稀世圣药/饰品',
					slot: '佩饰',
					atk: '+99 (满)',
					def: '+99 (满)',
					spd: '+99 (满)',
					mag: '+99 (满)',
					lck: '+99 (满)',
					usescr: '0x2A90',
					equscr: '0x0C1F',
					dropscr: '无',
					flags: '0xFFFF',
					consumable: '是',
					throwable: '否',
					sellable: '否',
					res: '全抗性 +90%',
					offset: '0x0010A2'
				},
				101: {
					name: '无极宝剑',
					role: '李逍遥',
					buy: '5000 文',
					sell: '2500 文',
					type: '神兵利器',
					slot: '武器',
					atk: '+120',
					def: '无',
					spd: '+20',
					mag: '+10',
					lck: '+5',
					usescr: '无',
					equscr: '0x0A2B',
					dropscr: '无',
					flags: '0x011A',
					consumable: '否',
					throwable: '否',
					sellable: '是',
					res: '无',
					offset: '0x0011C0'
				}
			};

			// 对于未定义物品，使用通用解耦生成策略
			if (DB[itemId]) return DB[itemId];
			
			const state = window.state;
			let baseItem = {
				name: `普通物品 #${itemId}`,
				role: '全员适用',
				buy: `${(itemId * 12 + 10)} 文`,
				sell: `${Math.floor((itemId * 12 + 10)/2)} 文`,
				type: '游戏普通道具',
				slot: '无',
				atk: '无',
				def: '无',
				spd: '无',
				mag: '无',
				lck: '无',
				usescr: '无',
				equscr: '无',
				dropscr: '无',
				flags: '0x0000',
				consumable: '是',
				throwable: '是',
				sellable: '是',
				res: '无',
				offset: '0x000000'
			};

			if (state && state.items && state.items[itemId]) {
				const item = state.items[itemId];
				baseItem.role = item.roleId === 0 ? '全员适用' : `角色 #${item.roleId}`;
				baseItem.buy = `${item.gold || (itemId * 20)} 文`;
				baseItem.sell = `${Math.floor((item.gold || (itemId * 20)) / 2)} 文`;
				baseItem.usescr = item.useScr ? '0x' + item.useScr.toString(16).toUpperCase() : '无';
				baseItem.equscr = item.equScr ? '0x' + item.equScr.toString(16).toUpperCase() : '无';
				baseItem.dropscr = item.dropScr ? '0x' + item.dropScr.toString(16).toUpperCase() : '无';
				baseItem.flags = '0x' + item.flags.toString(16).toUpperCase();
				baseItem.offset = '0x' + (itemId * 12).toString(16).toUpperCase();
				
				// 模拟仙剑高级武器护具的装备增益数据解耦
				if (item.equScr > 0) {
					baseItem.type = itemId % 2 === 0 ? '防具/法袍' : '武器/刀剑';
					baseItem.slot = itemId % 2 === 0 ? '防具' : '武器';
					baseItem.atk = itemId % 2 === 0 ? '无' : `+${20 + (itemId % 5) * 15}`;
					baseItem.def = itemId % 2 === 0 ? `+${15 + (itemId % 5) * 10}` : '无';
					baseItem.spd = `+${5 + (itemId % 3) * 5}`;
					baseItem.res = itemId % 2 === 0 ? '全抗性 +15%' : '无';
					baseItem.consumable = '否';
				}
			}

			return baseItem;
		}

		// ==================== 🎨 2D 像素图片解码与防糊缩放居中绘制 ====================
		function drawDecodedSprite(srcCanvas, destCanvasId, labelText) {
			const destCanvas = document.getElementById(destCanvasId);
			if (!destCanvas) return;
			
			const ctx = destCanvas.getContext('2d');
			ctx.imageSmoothingEnabled = false; // 关闭防平滑，像素画的灵魂！
			ctx.clearRect(0, 0, destCanvas.width, destCanvas.height);
			
			if (labelText && document.getElementById('lbl-item-ball-id')) {
				document.getElementById('lbl-item-ball-id').innerText = labelText;
			}

			if (srcCanvas) {
				// 计算自适应最大整数倍数以防半像素抖动
				const scale = Math.min(destCanvas.width / srcCanvas.width, destCanvas.height / srcCanvas.height);
				const cleanScale = Math.max(1, Math.floor(scale));
				
				const dx = (destCanvas.width - srcCanvas.width * cleanScale) / 2;
				const dy = (destCanvas.height - srcCanvas.height * cleanScale) / 2;
				
				ctx.drawImage(srcCanvas, dx, dy, srcCanvas.width * cleanScale, srcCanvas.height * cleanScale);
			} else {
				// 没图时画个极轻微的暗虚线框
				ctx.strokeStyle = 'rgba(255,255,255,0.03)';
				ctx.lineWidth = 1;
				ctx.strokeRect(4, 4, destCanvas.width - 8, destCanvas.height - 8);
			}
		}

					document.body.style.gridTemplateColumns = `1fr ${newWidth}px`;

					document.body.style.cursor = '';

		import('./dashboard/mapModal.js').then(({ initMapModal }) => {
			initMapModal();
		});
	};
	</script>
