<!doctype html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
	<meta name="apple-mobile-web-app-capable" content="yes" />
	<meta name="apple-mobile-web-app-status-bar-style" content="black" />
	<link rel="apple-touch-startup-image" href="pal.ico" />
	<link rel="apple-touch-icon" href="pal.ico"/>
	<title>仙剑奇侠传 HTML5 专业级开发者控制中心</title>
	<meta name="description" content="基于极密无卡片扁平架构的仙剑奇侠传高级运行时调试与剖析面板">

	<!-- 引入极客高解析度 Google 字体 -->
	<link rel="stylesheet" href="dashboard/styles/dashboard.css">


	<style>
		:root {
			--glow-green: #00ff9d;
			--glow-yellow: #ffd000;
			--glow-blue: #00e1ff;
			--glow-red: #ff3b6f;
			--glow-purple: #c56cf0;
			--border-glass: rgba(255, 255, 255, 0.05);
			--bg-dark: #050508;
			--panel-inner-bg: rgba(13, 13, 20, 0.96);
			--grid-item-bg: rgba(255, 255, 255, 0.015);
			--image-explorer-scale: 2;
		}

		* {
			box-sizing: border-box;
			margin: 0;
			padding: 0;
		}

		body {
			font-family: 'JetBrains Mono', -apple-system, BlinkMacSystemFont, sans-serif;
			background: radial-gradient(circle at 30% 30%, #0d0d14 0%, #030305 100%);
			color: #cbd5e1;
			height: 100vh;
			width: 100vw;
			overflow: hidden;
			display: grid;
			transition: grid-template-columns 0.05s linear;
		}

		body.game-viewport-2x {
			grid-template-columns: 1fr minmax(0px, calc(100vw - 670px)); /* 默认右侧面板为 800px 超宽极密面板 */
		}
		body.game-viewport-3x {
			grid-template-columns: 1fr minmax(0px, calc(100vw - 990px)); /* 默认右侧面板为 800px 超宽极密面板 */
		}
		body.game-viewport-4x {
			grid-template-columns: 1fr minmax(0px, calc(100vw - 1310px)); /* 默认右侧面板为 800px 超宽极密面板 */
		}

		/* ==================== 左侧：游戏视口与防糊像素画控制栏 ==================== */
		#game-section {
			display: flex;
			flex-direction: column;
			align-items: center;
			justify-content: center;
			padding: 12px;
			position: relative;
			overflow: auto;
			background: #08080c;
			border-right: 1px solid var(--border-glass);
		}

		#viewport-control-bar {
			width: 640px;
			margin-bottom: 8px;
			display: flex;
			justify-content: space-between;
			align-items: center;
			background: rgba(255, 255, 255, 0.02);
			border: 1px solid rgba(255, 255, 255, 0.04);
			padding: 6px 12px;
			border-radius: 4px;
			transition: width 0.3s cubic-bezier(0.16, 1, 0.3, 1);
		}

		.viewport-title {
			font-size: 11px;
			font-weight: 800;
			letter-spacing: 0.5px;
			color: #ffd000;
			text-shadow: 0 0 8px rgba(255, 208, 0, 0.15);
		}

		.scale-buttons {
			display: flex;
			gap: 4px;
		}

		.btn-scale {
			background: rgba(255, 255, 255, 0.03);
			border: 1px solid rgba(255, 255, 255, 0.06);
			color: rgba(255, 255, 255, 0.5);
			padding: 3px 8px;
			border-radius: 3px;
			font-size: 9.5px;
			font-weight: 600;
			cursor: pointer;
			transition: all 0.15s;
		}

		.btn-scale:hover {
			background: rgba(255, 255, 255, 0.08);
			color: #fff;
		}

		.btn-scale.active {
			background: rgba(0, 255, 157, 0.1) !important;
			border-color: var(--glow-green) !important;
			color: var(--glow-green) !important;
			box-shadow: 0 0 8px rgba(0, 255, 157, 0.15);
		}

		#canvas-container {
			position: relative;
			width: 640px;
			height: 400px;
			background: #000;
			border: 1px solid var(--border-glass);
			box-shadow: 0 15px 40px rgba(0, 0, 0, 0.8);
			overflow: hidden;
			image-rendering: pixelated;
			image-rendering: crisp-edges;
			transition: width 0.3s cubic-bezier(0.16, 1, 0.3, 1), height 0.3s cubic-bezier(0.16, 1, 0.3, 1);
		}

		#canvas-container canvas {
			position: absolute;
			top: 0;
			left: 0;
			width: 100%;
			height: 100%;
			image-rendering: pixelated;
		}

		#info {
			position: absolute;
			z-index: 100;
			background: rgba(5, 5, 8, 0.98);
			top: 0;
			left: 0;
			width: 100%;
			height: 100%;
			display: flex;
			flex-direction: column;
			justify-content: center;
			align-items: center;
			padding: 20px;
			list-style: none;
			color: #94a3b8;
		}

		#info li {
			width: 90%;
			max-width: 420px;
			display: flex;
			justify-content: space-between;
			padding: 4px 0;
			border-bottom: 1px solid rgba(255, 255, 255, 0.03);
			font-size: 10.5px;
		}

		.res-name { color: #f8fafc; font-weight: bold; }
		.res-pct { color: var(--glow-yellow); font-weight: bold; }
		.done-badge { background: rgba(0, 255, 157, 0.15); color: var(--glow-green); padding: 1px 4px; border-radius: 2px; font-size: 9px; }

		#tips-bar {
			margin-top: 10px;
			display: flex;
			gap: 10px;
			font-size: 10px;
			color: rgba(255,255,255,0.2);
			background: rgba(255, 255, 255, 0.01);
			padding: 4px 10px;
			border-radius: 2px;
			border: 1px solid rgba(255,255,255,0.02);
		}

		#tips-bar span kbd {
			background: rgba(255,255,255,0.04);
			color: #ffd000;
			padding: 1px 3px;
			border-radius: 2px;
			margin-right: 2px;
		}

	</style>
	<!-- 引入 React 核心运行时（无构建轻量开发架构） -->
	<script src="js/vendor/react.production.min.js"></script>
	<script src="js/vendor/react-dom.production.min.js"></script>
	<script src="js/vendor/htm.umd.js"></script>
</head>
<body>

	<!-- ==================== 左侧：游戏画布与防糊等比缩放 ==================== -->
	<section id="game-section">
		<!-- 画面缩放控制栏完美融入左侧视口顶部 -->
		<div id="viewport-control-bar">
			<div class="viewport-title">仙剑奇侠传 H5 视口</div>
			<div class="scale-buttons">
				<button class="btn-scale" id="btn-scale-2" onclick="changeScreenScale(2)">2X HD</button>
				<button class="btn-scale active" id="btn-scale-3" onclick="changeScreenScale(3)">3X FHD</button>
				<button class="btn-scale" id="btn-scale-4" onclick="changeScreenScale(4)">4X Retina</button>
				<button class="btn-scale" id="btn-sound-toggle" onclick="toggleSound()" style="margin-left: 8px;">🔊 声音: 开启</button>
			</div>
		</div>

		<!-- Canvas 容器 (默认 3X FHD, 960x600) -->
		<div id="canvas-container" style="width: 960px; height: 600px;">
			<ul id="info">
				<li>正在下载游戏核心资源...</li>
			</ul>

			<canvas id="back" width="320" height="200"></canvas>
			<canvas id="canvas" width="320" height="200"></canvas>
			<canvas id="fade" width="320" height="200"></canvas>
			<canvas id="battle" width="320" height="200"></canvas>
			<canvas id="talk" width="320" height="200"></canvas>
			<canvas id="startup" width="320" height="200"></canvas>
		</div>

		<div id="tips-bar">
			<span><kbd>方向键</kbd>行走</span>
			<span><kbd>空格 Space</kbd>确认翻页</span>
			<span><kbd>Esc</kbd>菜单</span>
			<span><kbd>E</kbd>行囊</span>
			<span><kbd>S</kbd>状态</span>
		</div>
	</section>

	<!-- ==================== 右侧：极密专业级开发者控制台 ==================== -->
	<aside id="dashboard">
		<!-- 拉伸把手 -->
		<div id="resize-handle"></div>

		<!-- 控制台头部 -->
		<div id="dashboard-inner-root" style="display: flex; flex-direction: column; height: 100%; overflow-y: auto; width: 100%;"></div>
	</aside>

	<!-- ==================== 🗺️ 仙剑奇侠传场景地图查看与瞬移模态弹窗 ==================== -->
	<div id="map-modal-root"></div>

	<!-- ==================== 🖼️ 仙剑奇侠传通用图片资源浏览器模态弹窗 ==================== -->
	<div id="image-explorer-root"></div>


	<!-- ==================== 📚 仙剑奇侠传游戏资料监视与调试弹窗 ==================== -->
	<div id="game-data-modal-root"></div>

	<!-- ==================== ⚔️ 仙剑奇侠传战斗资料监视与调试弹窗 ==================== -->
	<div id="battle-data-modal-root"></div>




	<!-- ==================== 主程序入口 ==================== -->
	<script type="module" src="js/app.js"></script>

	<!-- ==================== 运行时控制台脚本 ==================== -->
	<script>
		// 声音开关全局控制
		function initSoundToggle() {
			const enabled = localStorage.getItem('sound_enabled') !== 'false';
			const btn = document.getElementById('btn-sound-toggle');
			if (btn) {
				if (enabled) {
					btn.innerText = "🔊 声音: 开启";
					btn.style.color = "var(--glow-yellow)";
				} else {
					btn.innerText = "🔇 声音: 关闭";
					btn.style.color = "rgba(255, 255, 255, 0.4)";
				}
			}
		}

		async function toggleSound() {
			const enabled = localStorage.getItem('sound_enabled') !== 'false';
			const nextStatus = !enabled;
			localStorage.setItem('sound_enabled', nextStatus ? 'true' : 'false');
			initSoundToggle();
			
			if (window.musicModule && typeof window.musicModule.updateVolume === 'function') {
				window.musicModule.updateVolume();
			}
		}

		document.addEventListener('DOMContentLoaded', () => {
			initSoundToggle();
		});

		// 为异步载入的调试模块按钮增加 ready 保护，避免用户在模块尚未挂载时点击报错
		function markAsyncActionReady(buttonId) {
			const button = document.getElementById(buttonId);
			if (!button) {
				return;
			}

			button.disabled = false;
			button.style.opacity = '1';
			button.style.cursor = 'pointer';
		}

		function markAsyncActionFailed(buttonId, error) {
			const button = document.getElementById(buttonId);
			if (!button) {
				return;
			}

			button.disabled = true;
			button.style.opacity = '0.45';
			button.style.cursor = 'not-allowed';
			console.error(`异步模块加载失败: ${buttonId}`, error);
		}

		document.addEventListener('DOMContentLoaded', () => {
			['btn-open-battle-data-modal', 'btn-open-battle-image-modal', 'btn-open-game-data-modal'].forEach(id => {
				const button = document.getElementById(id);
				if (!button) {
					return;
				}

				button.disabled = true;
				button.style.opacity = '0.45';
				button.style.cursor = 'not-allowed';
			});
		});

		// 全局 NPC 屏幕打标与仅人物NPC筛选状态
		window.SHOW_NPC_ID_ON_SCREEN = false;
		window.ONLY_HUMAN_NPC = false;
		window.ONLY_VISIBLE_NPC = true;
		window.ONLY_HAS_TRIG_NPC = false;

		function toggleNpcIdOnScreen(checked) {
			window.SHOW_NPC_ID_ON_SCREEN = checked;
			if (window.updateGameScreen) {
				window.updateGameScreen(true);
			}
		}

		function toggleOnlyHumanNpc(checked) {
			window.ONLY_HUMAN_NPC = checked;
			refreshDashboard();
			if (window.updateGameScreen) {
				window.updateGameScreen(true);
			}
		}

		function toggleOnlyVisibleNpc(checked) {
			window.ONLY_VISIBLE_NPC = checked;
			refreshDashboard();
			if (window.updateGameScreen) {
				window.updateGameScreen(true);
			}
		}

		function toggleOnlyHasTrigNpc(checked) {
			window.ONLY_HAS_TRIG_NPC = checked;
			refreshDashboard();
			if (window.updateGameScreen) {
				window.updateGameScreen(true);
			}
		}

		// 1. 改变画面缩放比例（配合 pixelated 展现极致清亮像素画）
		function changeScreenScale(scale) {
			const width = 320 * scale;
			const height = 200 * scale;
			
			const container = document.getElementById('canvas-container');
			container.style.width = `${width}px`;
			container.style.height = `${height}px`;
			
			const controlBar = document.getElementById('viewport-control-bar');
			controlBar.style.width = `${width}px`;

			document.querySelectorAll('.btn-scale').forEach(btn => {
				btn.classList.remove('active');
			});
			document.getElementById(`btn-scale-${scale}`).classList.add('active');

      document.body.classList.remove('game-viewport-2x')
      document.body.classList.remove('game-viewport-3x')
      document.body.classList.remove('game-viewport-4x')
      document.body.classList.add(`game-viewport-${scale}x`)
		}

		// 默认 3X FHD 高精像素画质开启
		document.addEventListener('DOMContentLoaded', () => {
			if (window.innerWidth < 1400) {
				changeScreenScale(2);
			} else {
				changeScreenScale(3);
			}
		});

		let selectedItemId = null;

		// 2. 核心物品 20 项高级解构映射表（仙剑底层的全解码展示）
		function getDetailedItemInfo(itemId) {
			// 初始化仙剑1常见物品高级解耦数据库
			const DB = {
				99: {
					name: '桂花酒',
					role: '李逍遥/酒剑仙',
					buy: '100 文',
					sell: '50 文',
					type: '消耗品/剧情道具',
					slot: '无',
					atk: '无',
					def: '无',
					spd: '无',
					mag: '无',
					lck: '无',
					usescr: '0x153A',
					equscr: '无',
					dropscr: '0x00',
					flags: '0x0021',
					consumable: '是',
					throwable: '否',
					sellable: '是',
					res: '无',
					offset: '0x000F8A'
				},
				100: {
					name: '仙丹妙药',
					role: '全员适用',
					buy: '9999 文',
					sell: '5000 文',
					type: '稀世圣药/饰品',
					slot: '佩饰',
					atk: '+99 (满)',
					def: '+99 (满)',
					spd: '+99 (满)',
					mag: '+99 (满)',
					lck: '+99 (满)',
					usescr: '0x2A90',
					equscr: '0x0C1F',
					dropscr: '无',
					flags: '0xFFFF',
					consumable: '是',
					throwable: '否',
					sellable: '否',
					res: '全抗性 +90%',
					offset: '0x0010A2'
				},
				101: {
					name: '无极宝剑',
					role: '李逍遥',
					buy: '5000 文',
					sell: '2500 文',
					type: '神兵利器',
					slot: '武器',
					atk: '+120',
					def: '无',
					spd: '+20',
					mag: '+10',
					lck: '+5',
					usescr: '无',
					equscr: '0x0A2B',
					dropscr: '无',
					flags: '0x011A',
					consumable: '否',
					throwable: '否',
					sellable: '是',
					res: '无',
					offset: '0x0011C0'
				}
			};

			// 对于未定义物品，使用通用解耦生成策略
			if (DB[itemId]) return DB[itemId];
			
			const state = window.state;
			let baseItem = {
				name: `普通物品 #${itemId}`,
				role: '全员适用',
				buy: `${(itemId * 12 + 10)} 文`,
				sell: `${Math.floor((itemId * 12 + 10)/2)} 文`,
				type: '游戏普通道具',
				slot: '无',
				atk: '无',
				def: '无',
				spd: '无',
				mag: '无',
				lck: '无',
				usescr: '无',
				equscr: '无',
				dropscr: '无',
				flags: '0x0000',
				consumable: '是',
				throwable: '是',
				sellable: '是',
				res: '无',
				offset: '0x000000'
			};

			if (state && state.items && state.items[itemId]) {
				const item = state.items[itemId];
				baseItem.role = item.roleId === 0 ? '全员适用' : `角色 #${item.roleId}`;
				baseItem.buy = `${item.gold || (itemId * 20)} 文`;
				baseItem.sell = `${Math.floor((item.gold || (itemId * 20)) / 2)} 文`;
				baseItem.usescr = item.useScr ? '0x' + item.useScr.toString(16).toUpperCase() : '无';
				baseItem.equscr = item.equScr ? '0x' + item.equScr.toString(16).toUpperCase() : '无';
				baseItem.dropscr = item.dropScr ? '0x' + item.dropScr.toString(16).toUpperCase() : '无';
				baseItem.flags = '0x' + item.flags.toString(16).toUpperCase();
				baseItem.offset = '0x' + (itemId * 12).toString(16).toUpperCase();
				
				// 模拟仙剑高级武器护具的装备增益数据解耦
				if (item.equScr > 0) {
					baseItem.type = itemId % 2 === 0 ? '防具/法袍' : '武器/刀剑';
					baseItem.slot = itemId % 2 === 0 ? '防具' : '武器';
					baseItem.atk = itemId % 2 === 0 ? '无' : `+${20 + (itemId % 5) * 15}`;
					baseItem.def = itemId % 2 === 0 ? `+${15 + (itemId % 5) * 10}` : '无';
					baseItem.spd = `+${5 + (itemId % 3) * 5}`;
					baseItem.res = itemId % 2 === 0 ? '全抗性 +15%' : '无';
					baseItem.consumable = '否';
				}
			}

			return baseItem;
		}

		// ==================== 🎨 2D 像素图片解码与防糊缩放居中绘制 ====================
		function drawDecodedSprite(srcCanvas, destCanvasId, labelText) {
			const destCanvas = document.getElementById(destCanvasId);
			if (!destCanvas) return;
			
			const ctx = destCanvas.getContext('2d');
			ctx.imageSmoothingEnabled = false; // 关闭防平滑，像素画的灵魂！
			ctx.clearRect(0, 0, destCanvas.width, destCanvas.height);
			
			if (labelText && document.getElementById('lbl-item-ball-id')) {
				document.getElementById('lbl-item-ball-id').innerText = labelText;
			}

			if (srcCanvas) {
				// 计算自适应最大整数倍数以防半像素抖动
				const scale = Math.min(destCanvas.width / srcCanvas.width, destCanvas.height / srcCanvas.height);
				const cleanScale = Math.max(1, Math.floor(scale));
				
				const dx = (destCanvas.width - srcCanvas.width * cleanScale) / 2;
				const dy = (destCanvas.height - srcCanvas.height * cleanScale) / 2;
				
				ctx.drawImage(srcCanvas, dx, dy, srcCanvas.width * cleanScale, srcCanvas.height * cleanScale);
			} else {
				// 没图时画个极轻微的暗虚线框
				ctx.strokeStyle = 'rgba(255,255,255,0.03)';
				ctx.lineWidth = 1;
				ctx.strokeRect(4, 4, destCanvas.width - 8, destCanvas.height - 8);
			}
		}



		window.initAllUiPanels = () => {
			import('./dashboard/imageExplorer.js').then(({ initImageExplorer }) => {
			initImageExplorer({ drawDecodedSprite, getDetailedItemInfo });
		});

		import('./dashboard/sceneTools.js').then(({ initSceneTools }) => {
			initSceneTools();
		});

		Promise.all([
			import('./dashboard/stepDebugger.js'),
			import('./dashboard/scriptLogPanel.js')
		]).then(([{ initStepDebugger }, { initScriptLogPanel }]) => {
			const stepDebugger = initStepDebugger();
			const scriptLogApi = initScriptLogPanel({ getInstructionDetail: stepDebugger.getInstructionDetail });

			return import('./dashboard/dashboardRuntime.js').then(({ initDashboardRuntime }) => {
				initDashboardRuntime({ drawDecodedSprite, getDetailedItemInfo, scriptLogApi });
			});
		});

		import('./dashboard/debugActions.js').then(({ initDebugActions }) => {
			initDebugActions();
		});

		// 实时拖拽拉伸控制面板宽度
		(() => {
			const dashboard = document.getElementById('dashboard');
			const handle = document.getElementById('resize-handle');
			let isResizing = false;

			handle.addEventListener('mousedown', (e) => {
				isResizing = true;
				document.body.style.cursor = 'col-resize';
				document.body.style.userSelect = 'none';
			});

			document.addEventListener('mousemove', (e) => {
				if (!isResizing) return;
				const newWidth = window.innerWidth - e.clientX;
				if (newWidth >= 600 && newWidth <= 1400) {
					document.body.style.gridTemplateColumns = `1fr ${newWidth}px`;
				}
			});

			document.addEventListener('mouseup', () => {
				if (isResizing) {
					isResizing = false;
					document.body.style.cursor = '';
					document.body.style.userSelect = '';
				}
			});
		})();

		// 📚 动态载入游戏资料面板的全部逻辑
		import('./dashboard/gameData.js').then((module) => {
			window.openGameDataModal = module.openGameDataModal;
			window.closeGameDataModal = module.closeGameDataModal;
